name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: docker compose up --build -d
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/test_commerce.py
        env:
          COMMERCE_SCREENSHOTS: artifacts/browser
      - if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: capturas-da-loja
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 14
