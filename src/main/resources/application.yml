spring:
  application:
    name: sinal-dois
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/reserva}
    username: ${DB_USER:reserva}
    password: ${DB_PASSWORD:reserva-local}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  session:
    jdbc:
      initialize-schema: never

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: strict

commerce:
  operator-password: ${COMMERCE_OPERATOR_PASSWORD:}
  worker:
    interval: 1s

reservation:
  ttl: ${RESERVATION_TTL:2m}
  expiry:
    enabled: true
    interval: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    operations-sorter: method
